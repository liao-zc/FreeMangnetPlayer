name: Android APK
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load stable app signing key
        env:
          FMP_KEYSTORE_B64: ${{ secrets.FMP_KEYSTORE_B64 }}
          FMP_STORE_PASSWORD: ${{ secrets.FMP_STORE_PASSWORD }}
        run: |
          test -n "$FMP_KEYSTORE_B64"
          printf '%s' "$FMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmp.p12"
          echo "FMP_KEYSTORE=$RUNNER_TEMP/fmp.p12" >> "$GITHUB_ENV"
          echo "FMP_STORE_PASSWORD=$FMP_STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Check repository source encoding
        run: python3 scripts/check_repository.py
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: |
          PACKAGE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          echo "PACKAGE_REF=$PACKAGE_REF" >> "$GITHUB_ENV"
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/OmniPlayer-${PACKAGE_REF}.apk
      - name: Build smaller ARM packages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            gradle --no-daemon assembleDebug -PtargetAbi="$abi"
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/OmniPlayer-${PACKAGE_REF}-${abi}.apk"
          done
      - name: Package named source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: git archive --format=zip --prefix=OmniPlayer-${PACKAGE_REF}/ --output=OmniPlayer-${PACKAGE_REF}-source.zip HEAD
      - name: Publish GitHub release APK and source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "release-assets/OmniPlayer-${PACKAGE_REF}.apk" "release-assets/OmniPlayer-${PACKAGE_REF}-arm64-v8a.apk" "release-assets/OmniPlayer-${PACKAGE_REF}-armeabi-v7a.apk" "OmniPlayer-${PACKAGE_REF}-source.zip" --generate-notes --title "OmniPlayer ${GITHUB_REF_NAME}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPlayer-${{ env.PACKAGE_REF }}
          path: release-assets/OmniPlayer-${{ env.PACKAGE_REF }}.apk
