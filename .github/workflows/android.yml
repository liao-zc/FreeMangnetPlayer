name: Android APK
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FreeMangnetPlayer-${GITHUB_REF_NAME}.apk
      - name: Package named source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: git archive --format=zip --prefix=FreeMangnetPlayer-${GITHUB_REF_NAME}/ --output=FreeMangnetPlayer-${GITHUB_REF_NAME}-source.zip HEAD
      - name: Publish GitHub release APK and source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "app/build/outputs/apk/debug/FreeMangnetPlayer-${GITHUB_REF_NAME}.apk" "FreeMangnetPlayer-${GITHUB_REF_NAME}-source.zip" --generate-notes --title "FreeMangnetPlayer ${GITHUB_REF_NAME}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMangnetPlayer-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/FreeMangnetPlayer-${{ github.ref_name }}.apk
