name: OmniPlayer full audit, UI regressions, search pagination, and APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check component boundaries and repository text
        run: |
          python3 scripts/architecture-smoke-check.py
          python3 scripts/check_repository.py
          python3 -m py_compile scripts/architecture-smoke-check.py scripts/check_repository.py scripts/verify_library_revision.py scripts/verify_preferences_revision.py scripts/verify_search_pages.py scripts/summarize_ci_results.py
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Load stable app signing key
        env:
          FMP_KEYSTORE_B64: ${{ secrets.FMP_KEYSTORE_B64 }}
          FMP_STORE_PASSWORD: ${{ secrets.FMP_STORE_PASSWORD }}
        run: |
          test -n "$FMP_KEYSTORE_B64"
          printf '%s' "$FMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmp.p12"
          echo "FMP_KEYSTORE=$RUNNER_TEMP/fmp.p12" >> "$GITHUB_ENV"
          echo "FMP_STORE_PASSWORD=$FMP_STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK and Android instrumentation APK
        id: build_apk
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Prepare controlled multi-file BitTorrent fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent python3-pil ffmpeg
          /usr/bin/python3 scripts/library_fixture.py > fixture.log 2>&1 &
          for i in $(seq 1 180); do test -f optimization-fixture.json && break; sleep 1; done
          test -f optimization-fixture.json
      - name: Prepare controlled search pagination fixture
        run: |
          python3 scripts/search_page_fixture.py > search-fixture.log 2>&1 &
          for i in $(seq 1 30); do test -f search-pages-expected.json && break; sleep 1; done
          test -f search-pages-expected.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator_regression
        env: {FMP_FAST_UI: '1'}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash scripts/run_android_regressions.sh
      - name: Write report to workflow summary
        if: always()
        env:
          OMNI_BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          OMNI_EMULATOR_OUTCOME: ${{ steps.emulator_regression.outcome }}
        run: |
          python3 scripts/summarize_ci_results.py
          echo '## Emulator regression suites' >> "$GITHUB_STEP_SUMMARY"
          cat manual-shots/OmniPlayer-CI-Report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OmniPlayer-CI-report-and-debug-APK
          path: |
            manual-shots/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/app-debug.apk
            scripts/run_ui_regressions.sh
            scripts/run_android_regressions.sh
            scripts/summarize_ci_results.py
