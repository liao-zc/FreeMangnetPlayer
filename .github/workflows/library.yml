name: Cached library and local pagination verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Load stable signing key
        env:
          FMP_KEYSTORE_B64: ${{ secrets.FMP_KEYSTORE_B64 }}
          FMP_STORE_PASSWORD: ${{ secrets.FMP_STORE_PASSWORD }}
        run: |
          printf '%s' "$FMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmp.p12"
          echo "FMP_KEYSTORE=$RUNNER_TEMP/fmp.p12" >> "$GITHUB_ENV"
          echo "FMP_STORE_PASSWORD=$FMP_STORE_PASSWORD" >> "$GITHUB_ENV"
      - run: gradle --no-daemon assembleDebug
      - name: Prepare real multi-file seeds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent python3-pil ffmpeg
          /usr/bin/python3 scripts/library_fixture.py > fixture.log 2>&1 &
          for i in $(seq 1 180); do test -f optimization-fixture.json && break; sleep 1; done
          test -f optimization-fixture.json
      - name: Start controlled search website
        run: |
          python3 scripts/search_page_fixture.py > search-fixture.log 2>&1 &
          for i in $(seq 1 30); do test -f search-pages-expected.json && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {FMP_FAST_UI: '1'}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: set -e; adb install -r ui-inspector/build/outputs/apk/debug/ui-inspector-debug.apk; python3 scripts/verify_library_revision.py; python3 scripts/verify_search_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-verification
          path: manual-shots/
