name: Independent native observation of ten magnets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-libtorrent
      - run: /usr/bin/python3 scripts/native_public_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-public-acceptance
          path: native-public-acceptance.json
