name: Same resource search and renderer comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Load stable signing key
        env:
          FMP_KEYSTORE_B64: ${{ secrets.FMP_KEYSTORE_B64 }}
          FMP_STORE_PASSWORD: ${{ secrets.FMP_STORE_PASSWORD }}
        run: |
          printf '%s' "$FMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmp.p12"
          echo "FMP_KEYSTORE=$RUNNER_TEMP/fmp.p12" >> "$GITHUB_ENV"
          echo "FMP_STORE_PASSWORD=$FMP_STORE_PASSWORD" >> "$GITHUB_ENV"
      - run: gradle --no-daemon assembleDebug
      - name: Download reference APK
        run: curl -fL --retry 4 -o reference.apk 'https://github.com/zaidielykelee/Magnet_player/releases/download/1.5.0%2B8/st_v1.5.0_9_20260510_211803.apk'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {FMP_FAST_UI: '1'}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: adb install -r ui-inspector/build/outputs/apk/debug/ui-inspector-debug.apk; python3 scripts/compare_same_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-search-${{ matrix.api }}
          path: manual-shots/
