name: Capture app usage screenshots
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/capture_usage_screenshots.py"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app
        run: gradle --no-daemon assembleDebug
      - name: Run app in Android emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: python3 scripts/capture_usage_screenshots.py
      - name: Commit screenshots to docs
        run: |
          git rm -f docs/screenshots/*.png || true
          mkdir -p docs/screenshots
          cp manual-shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Refresh app usage screenshots"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreeMangnetPlayer-usage-screenshots
          path: manual-shots/*.png