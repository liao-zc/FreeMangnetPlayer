name: Capture app usage screenshots
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/capture_usage_screenshots.py"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app
        run: gradle --no-daemon assembleDebug
      - name: Prepare real BitTorrent seed and browser baseline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent ffmpeg
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          /usr/bin/python3 scripts/torrent_fixture.py > fixture.log 2>&1 &
          python3 scripts/browser_baseline.py
          for i in $(seq 1 120); do test -f fixture.json && break; sleep 1; done
          test -f fixture.json || (cat fixture.log; exit 1)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in Android emulator and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: /usr/bin/python3 scripts/verify_real_app.py
      - name: Commit screenshots to docs
        run: |
          # Keep previous screenshots as historical evidence.
          mkdir -p docs/screenshots
          cp manual-shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Refresh app usage screenshots"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreeMangnetPlayer-usage-screenshots
          path: manual-shots/