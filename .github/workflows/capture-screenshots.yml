name: Capture app usage screenshots
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/capture_usage_screenshots.py"
      - ".github/workflows/capture-screenshots.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Test scope
        default: player-revision
        type: choice
        options: [player-revision, performance, optimization, full, user-resources, engines, titles]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load stable app signing key
        env:
          FMP_KEYSTORE_B64: ${{ secrets.FMP_KEYSTORE_B64 }}
          FMP_STORE_PASSWORD: ${{ secrets.FMP_STORE_PASSWORD }}
        run: |
          test -n "$FMP_KEYSTORE_B64"
          printf '%s' "$FMP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fmp.p12"
          echo "FMP_KEYSTORE=$RUNNER_TEMP/fmp.p12" >> "$GITHUB_ENV"
          echo "FMP_STORE_PASSWORD=$FMP_STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Check repository source encoding
        run: python3 scripts/check_repository.py
      - name: Build app
        run: gradle --no-daemon assembleDebug
      - name: Prepare real BitTorrent seed and browser baseline
        if: inputs.mode == 'full' || inputs.mode == 'engines'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent python3-pil ffmpeg
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          /usr/bin/python3 scripts/torrent_fixture.py > fixture.log 2>&1 &
          python3 scripts/browser_baseline.py
          for i in $(seq 1 120); do test -f fixture.json && break; sleep 1; done
          test -f fixture.json || (cat fixture.log; exit 1)
      - name: Prepare multi-file real seeds
        if: inputs.mode == 'optimization' || inputs.mode == 'player-revision' || github.event_name == 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent python3-pil ffmpeg
          if [ "${{ inputs.mode }}" = optimization ]; then /usr/bin/python3 scripts/optimization_fixture.py > fixture.log 2>&1 & else /usr/bin/python3 scripts/player_revision_fixture.py > fixture.log 2>&1 & fi
          for i in $(seq 1 120); do test -f optimization-fixture.json && break; sleep 1; done
          test -f optimization-fixture.json || (cat fixture.log; exit 1)
      - name: Prepare unlimited real seed and native baseline
        if: inputs.mode == 'performance'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-libtorrent python3-pil ffmpeg
          /usr/bin/python3 scripts/performance_fixture.py > fixture.log 2>&1 &
          for i in $(seq 1 240); do test -f performance-fixture.json && break; sleep 1; done
          test -f performance-fixture.json || (cat fixture.log; exit 1)
      - name: Probe public DHT network with official Ubuntu resource
        if: inputs.mode == 'performance' || inputs.mode == 'player-revision' || github.event_name == 'push'
        run: |
          /usr/bin/python3 scripts/public_network_probe.py
          /usr/bin/python3 scripts/user_network_probe.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in Android emulator and capture UI
        env:
          FMP_FAST_UI: '1'
          FMP_TEST_MODE: ${{ inputs.mode || 'player-revision' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 600
          disable-animations: true
          script: adb install -r ui-inspector/build/outputs/apk/debug/ui-inspector-debug.apk; if [ "$FMP_TEST_MODE" = user-resources ]; then /usr/bin/python3 scripts/verify_public_acceptance.py; elif [ "$FMP_TEST_MODE" = player-revision ]; then /usr/bin/python3 scripts/verify_player_revision.py; elif [ "$FMP_TEST_MODE" = performance ]; then /usr/bin/python3 scripts/verify_performance.py; elif [ "$FMP_TEST_MODE" = optimization ]; then /usr/bin/python3 scripts/verify_optimization.py; else /usr/bin/python3 scripts/verify_real_app.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FreeMangnetPlayer-usage-screenshots
          path: |
            manual-shots/
            fixture.log
            public-network-baseline.json
            user-network-baseline.json
